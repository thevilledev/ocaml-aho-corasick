name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["4.14", "5.4"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-repositories: |
            default: https://opam.ocaml.org
          opam-disable-sandboxing: true
      - run: opam install . --deps-only --with-test --with-doc
      - run: opam lint --warnings=@1..999 aho-corasick.opam
      - run: opam exec -- dune build @all @doc
      - name: Check generated opam metadata
        run: git diff --exit-code -- aho-corasick.opam
      - run: opam exec -- dune runtest
      - name: Build and install the package
        run: |
          opam exec -- dune build -p aho-corasick @install @runtest @doc
          opam exec -- dune install --prefix "$RUNNER_TEMP/aho-install" aho-corasick
      - name: Check documentation website
        run: |
          mkdir -p _site/api
          cp -R website/. _site/
          cp -R _build/default/_doc/_html/. _site/api/
          python3 scripts/check_site.py _site

  lower-bounds:
    name: Lower bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14.0"
          opam-repositories: |
            default: https://opam.ocaml.org
          opam-disable-sandboxing: true
      - name: Pin minimum Dune
        run: >-
          opam pin add dune.3.14.0
          git+https://github.com/ocaml/dune.git#3.14.0
          --no-action --yes
      - name: Install minimum dependencies
        run: |
          opam install dune.3.14.0 alcotest.1.5.0 qcheck-core.0.25 qcheck-alcotest.0.25
          opam install . --deps-only --with-test
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest

  # Differential test against the Rust aho-corasick crate, pyahocorasick
  # and ahocorasick_rs on the fixed vectors plus 20 000 generated cases
  # (compat/README.md), then a smoke run of the benchmark suite, whose
  # match counts are cross-checked between implementations as well.
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"
          opam-repositories: |
            default: https://opam.ocaml.org
          opam-disable-sandboxing: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyahocorasick==2.3.1 ahocorasick_rs==1.0.3
      - run: opam install . --deps-only
      - run: opam exec -- ./compat/run.sh
      - run: SECONDS_PER_RUN=0.2 WORKLOADS=workloads-smoke.tsv opam exec -- ./bench/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-outputs
          path: |
            compat/_out
            bench/_out
